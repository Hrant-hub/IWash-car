<ion-header>
  <ion-toolbar>
    <ion-title>Օգնականի կարգավորումներ</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Անձնական տվյալներ</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      @if (loadingProfile) {
        <ion-spinner name="crescent"></ion-spinner>
      } @else {
        <p>Էլ. փոստ՝ {{ profile?.email || '-' }}</p>
        <p>Դեր՝ {{ profile?.role || '-' }}</p>
      }
    </ion-card-content>
  </ion-card>

  <ion-card>
    <ion-card-header>
      <ion-card-title>Պատվերի տվյալներ</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <p>Պատվերների քանակ՝ {{ ordersCount }}</p>
      <ion-button size="small" fill="outline" routerLink="/order-history">Բացել պատմությունը</ion-button>
    </ion-card-content>
  </ion-card>

  <ion-card>
    <ion-card-header>
      <ion-card-title>Հասանելիություն</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-item>
        <ion-label>Ակտիվ</ion-label>
        <ion-toggle [checked]="isActive" (ionChange)="toggleActive($event.detail.checked)"></ion-toggle>
      </ion-item>
    </ion-card-content>
  </ion-card>

  <ion-button expand="block" fill="outline" (click)="backToDashboard()">
    Վերադառնալ վահանակ
  </ion-button>
</ion-content>
